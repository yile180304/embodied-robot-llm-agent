[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-agent-mvp"
version = "0.1.0"
description = "Safe MQTT and Function Calling loop for an embodied robot simulator"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["llm-agent", "langgraph", "mqtt", "robotics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7,<3",
    "paho-mqtt>=2.1,<3",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.4,<2",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
firmware-dev = [
    "ziglang==0.16.0",
]

[project.scripts]
embodied-agent = "embodied_agent.cli:main"

[project.urls]
Homepage = "https://github.com/yile180304/embodied-robot-llm-agent"
Repository = "https://github.com/yile180304/embodied-robot-llm-agent.git"
Issues = "https://github.com/yile180304/embodied-robot-llm-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mqtt_integration: requires a real MQTT broker on localhost",
]
